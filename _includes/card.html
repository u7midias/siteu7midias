{%- assign palavras = include.post.content | number_of_words -%}
{%- assign minutos = palavras | divided_by: 200 | plus: 1 -%}
<a class="card{% if include.destaque %} destaque{% endif %}" href="{{ include.post.url | relative_url }}" data-cat="{{ include.post.categoria | slugify }}">
  <div class="card-cat">{{ include.post.categoria }}</div>
  <h2>{{ include.post.title }}</h2>
  <p>{{ include.post.description }}</p>
  <div class="card-meta">{% include data-br.html data=include.post.date %} · {{ minutos }} min de leitura</div>
</a>
